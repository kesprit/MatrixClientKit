name: Bug report
description: Report incorrect behaviour in MatrixClientKit.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this in.

        **If this is a security vulnerability**, please don't open a public issue: follow
        [`SECURITY.md`](../blob/main/SECURITY.md).

        **If the problem is in the protocol or the encryption itself** rather than in this Swift
        façade, it most likely belongs upstream in
        [`matrix-rust-sdk`](https://github.com/matrix-org/matrix-rust-sdk).
  - type: input
    id: version
    attributes:
      label: MatrixClientKit version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: "iOS 18.2, iPhone 16 simulator"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: The full error and a stack trace if you have one. Please strip tokens, credentials and private homeserver addresses.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet beats a description.
      render: swift
    validations:
      required: true
