name: Demande de fonctionnalité
description: Proposer une API ou un domaine à couvrir.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        La feuille de route du README indique ce qui est déjà prévu et à quel palier. Vérifiez-la
        avant d'ouvrir : si votre besoin y figure, un commentaire sur l'issue existante — ou une
        nouvelle issue disant pourquoi il vous faut ce palier plus tôt — est plus utile.
  - type: textarea
    id: problem
    attributes:
      label: Le problème
      description: Que cherchez-vous à faire, et qu'est-ce qui bloque aujourd'hui ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: L'API souhaitée
      description: Esquisse de signature, même approximative.
      render: swift
    validations:
      required: false
  - type: dropdown
    id: upstream
    attributes:
      label: Le SDK Rust amont couvre-t-il déjà ce besoin ?
      options:
        - Oui, c'est une question d'exposition dans la façade
        - Non, il faudrait d'abord que l'amont le fasse
        - Je ne sais pas
    validations:
      required: true
