name: Feature request
description: Propose an API or an area to cover.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The README's roadmap says what is already planned and for which milestone. Please check it
        first: if your need is already there, a comment on the existing issue — or a new issue
        explaining why you need that milestone sooner — is more useful.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The API you have in mind
      description: A sketch of the signature, however rough.
      render: swift
    validations:
      required: false
  - type: dropdown
    id: upstream
    attributes:
      label: Does the upstream Rust SDK already cover this?
      options:
        - Yes, it is a matter of exposing it in the façade
        - No, upstream would have to do it first
        - I don't know
    validations:
      required: true
