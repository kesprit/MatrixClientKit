name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint & docs
    # Standard runner: free and unmetered on a public repository. Never a larger runner.
    runs-on: macos-15
    # The suite has around a dozen unbounded suspension points: a regression that stopped a
    # value from arriving would hang the runner instead of failing.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The manifest is swift-tools-version 6.2: letting the image's default Xcode pick the
      # toolchain would make the build depend on the image rotation schedule. The pin is on the
      # major version, which determines the Swift version; the point release stays the image's.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # The upstream XCFramework is large: cache both the SwiftPM directory and the one
      # xcodebuild uses for its own package copies, or it re-downloads everything.
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .xcode-spm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (macOS)
        run: swift build --build-tests

      # The integration suite needs a real homeserver and real credentials: it never runs in CI,
      # by design (see Tests/MatrixClientKitIntegrationTests/README.md).
      - name: Test (unitaires)
        run: swift test --skip MatrixClientKitIntegrationTests

      # The package declares .iOS(.v18): without this step, nothing guarantees it compiles for
      # the platform that is its main target.
      - name: Build (iOS)
        run: |
          xcodebuild build -quiet \
            -scheme MatrixClientKit \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .xcode-spm \
            -derivedDataPath .xcode-derived

      - name: Lint (swift-format)
        run: swift format lint --recursive --strict Sources Tests

      # A manual pipeline rather than `swift-docc-plugin`: that would be a resolution dependency
      # every consuming application pays for, to serve a maintainer-only command.
      - name: Build DocC
        run: |
          # `.build/docc-symbols` is deliberately not cleared: the SPM cache can leave the build
          # "up to date", in which case nothing would be re-emitted and the step would fail on an
          # empty directory. A module that changed is recompiled, so its graph is rewritten.
          rm -rf .build/docc-symbols-final docs-build
          swift build --target MatrixClientKit \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/docc-symbols \
            -Xswiftc -symbol-graph-minimum-access-level -Xswiftc public
          mkdir -p .build/docc-symbols-final
          cp .build/docc-symbols/MatrixClientKit.symbols.json .build/docc-symbols-final/
          xcrun docc convert Sources/MatrixClientKit/Documentation.docc \
            --additional-symbol-graph-dir .build/docc-symbols-final \
            --output-path docs-build \
            --fallback-display-name MatrixClientKit \
            --fallback-bundle-identifier com.kesprit.MatrixClientKit \
            --fallback-bundle-version 0.1.0 \
            --warnings-as-errors
