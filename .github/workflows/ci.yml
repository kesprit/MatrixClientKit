name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint & docs
    # Runner standard : gratuit et non plafonné sur dépôt public. Aucun larger runner.
    runs-on: macos-15
    # La suite comporte une dizaine de points de suspension non bornés : une régression qui
    # empêcherait une valeur d'arriver ferait pendre le runner au lieu d'échouer.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Le manifeste est en swift-tools-version 6.2 : laisser le Xcode par défaut de l'image
      # décider de la version du toolchain reviendrait à faire dépendre la compilation du
      # calendrier de rotation des images. Le pin porte sur la majeure, qui détermine la version
      # de Swift ; le point release reste celui de l'image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # Le XCFramework amont est volumineux : on met en cache le dossier SwiftPM ET celui que
      # xcodebuild utilise pour ses propres copies de paquets, sans quoi il retélécharge tout.
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .xcode-spm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (macOS)
        run: swift build --build-tests

      # La suite d'intégration exige un homeserver et des identifiants réels : elle ne s'exécute
      # jamais en CI, par conception (voir Tests/MatrixClientKitIntegrationTests/README.md).
      - name: Test (unitaires)
        run: swift test --skip MatrixClientKitIntegrationTests

      # Le paquet déclare .iOS(.v18) : sans cette étape, rien ne garantit qu'il compile pour la
      # plateforme qui est sa cible principale.
      - name: Build (iOS)
        run: |
          xcodebuild build -quiet \
            -scheme MatrixClientKit \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .xcode-spm \
            -derivedDataPath .xcode-derived

      - name: Lint (swift-format)
        run: swift format lint --recursive --strict Sources Tests

      # Pipeline manuel plutôt que `swift-docc-plugin` : une dépendance de résolution que chaque
      # application consommatrice paierait, pour une commande de mainteneur.
      - name: Build DocC
        run: |
          # `.build/docc-symbols` n'est volontairement pas effacé : le cache SPM peut rendre la
          # compilation « à jour », auquel cas rien ne serait réémis et l'étape échouerait sur un
          # répertoire vide. Un module qui change est recompilé, donc son graphe est réécrit.
          rm -rf .build/docc-symbols-final docs-build
          swift build --target MatrixClientKit \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/docc-symbols \
            -Xswiftc -symbol-graph-minimum-access-level -Xswiftc public
          mkdir -p .build/docc-symbols-final
          cp .build/docc-symbols/MatrixClientKit.symbols.json .build/docc-symbols-final/
          xcrun docc convert Sources/MatrixClientKit/Documentation.docc \
            --additional-symbol-graph-dir .build/docc-symbols-final \
            --output-path docs-build \
            --fallback-display-name MatrixClientKit \
            --fallback-bundle-identifier com.kesprit.MatrixClientKit \
            --fallback-bundle-version 0.1.0 \
            --warnings-as-errors
