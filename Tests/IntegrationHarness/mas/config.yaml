passwords:
  enabled: true
  schemes:
  - version: 1
    algorithm: argon2id
  minimum_complexity: 0
matrix:
  kind: synapse
  homeserver: localhost
  secret: mck-harness-mas-synapse-secret
  endpoint: http://synapse-oauth:8008/
account:
  password_registration_enabled: false
# Le harnais enchaîne les connexions depuis la même adresse.
rate_limiting:
  login:
    per_ip: { burst: 1000, per_second: 1000 }
    per_account: { burst: 1000, per_second: 1000 }
