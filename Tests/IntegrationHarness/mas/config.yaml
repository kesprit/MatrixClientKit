# Configuration MAS du harnais d'intégration (jamais en CI).
# TOUT le contenu de ce fichier (clés de signature, clé de chiffrement, secret partagé avec Synapse,
# mots de passe de base) est une valeur de TEST, sans valeur hors de ce harnais local.
# Hôte : MAS est publié sur http://localhost:8082 (le 8080 de l'hôte est souvent pris) ;
# Synapse le joint par le réseau compose en http://mas:8080.
http:
  listeners:
  - name: web
    resources:
    - name: discovery
    - name: human
    - name: oauth
    - name: compat
    - name: graphql
    - name: assets
    binds:
    - address: '[::]:8080'
    proxy_protocol: false
  - name: internal
    resources:
    - name: health
    binds:
    - host: localhost
      port: 8081
    proxy_protocol: false
  trusted_proxies:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 10.0.0.0/10
  - 127.0.0.1/8
  - fd00::/8
  - ::1/128
  public_base: http://localhost:8082/
  issuer: http://localhost:8082/
database:
  uri: postgresql://mas:mas@postgres/mas
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
email:
  from: '"Authentication Service" <root@localhost>'
  reply_to: '"Authentication Service" <root@localhost>'
  transport: blackhole
