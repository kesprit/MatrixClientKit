# Harnais d'intégration de MatrixClientKit — lancé à la main, jamais en CI.
# Toutes les clés et tous les secrets de ce répertoire sont des valeurs de TEST, sans valeur hors
# de ce harnais local.
name: mck-harness

services:
  synapse-password:
    image: ghcr.io/element-hq/synapse:v1.162.0
    entrypoint: []
    command: ["sh", "-c", "test -f /data/signing.key || python -m synapse.app.homeserver -c /config/homeserver.yaml --generate-keys; exec python -m synapse.app.homeserver -c /config/homeserver.yaml"]
    ports: ["127.0.0.1:8008:8008"]
    volumes:
      - ./synapse-password:/config:ro
      - synapse-password-data:/data
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 2s
      retries: 60

  # Même image, jeton d'accès à durée de vie courte : provoque le soft logout (Q1).
  synapse-expiring:
    image: ghcr.io/element-hq/synapse:v1.162.0
    entrypoint: []
    command: ["sh", "-c", "test -f /data/signing.key || python -m synapse.app.homeserver -c /config/homeserver.yaml --generate-keys; exec python -m synapse.app.homeserver -c /config/homeserver.yaml"]
    ports: ["127.0.0.1:8009:8008"]
    volumes:
      - ./synapse-expiring:/config:ro
      - synapse-expiring-data:/data
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 2s
      retries: 60

  # Base commune à MAS et au Synapse délégué. Pas de volume nommé : état éphémère (volume anonyme, effacé par `down -v`), recréé par `up`.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres # TEST
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 60

  # Matrix Authentication Service : fournisseur OAuth du Synapse délégué. Joignable depuis l'hôte
  # (le SDK le contacte directement) sur 8082 ; le 8080 de l'hôte est souvent occupé.
  # L'image n'a pas de healthcheck (ni curl) : compose ne l'attend pas, `integration-harness.sh up`
  # sonde /.well-known/openid-configuration avant de s'en servir.
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.26.0
    command: ["server", "--config", "/config/config.yaml"]
    ports: ["127.0.0.1:8082:8080"]
    volumes: ["./mas:/config:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  # Synapse dont l'authentification est déléguée à MAS, avec le rendez-vous MSC4108 (QR code).
  synapse-oauth:
    image: ghcr.io/element-hq/synapse:v1.162.0
    entrypoint: []
    command: ["sh", "-c", "test -f /data/signing.key || python -m synapse.app.homeserver -c /config/homeserver.yaml --generate-keys; exec python -m synapse.app.homeserver -c /config/homeserver.yaml"]
    ports: ["127.0.0.1:8010:8008"]
    volumes:
      - ./synapse-oauth:/config:ro
      - synapse-oauth-data:/data
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    depends_on:
      postgres: { condition: service_healthy }
      mas: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 2s
      retries: 60

volumes:
  synapse-password-data:
  synapse-expiring-data:
  synapse-oauth-data:
